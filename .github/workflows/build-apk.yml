name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'dist/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor 6 (stable, Java 17+)
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 cross-env --save

      - name: Build web (for Capacitor)
        run: npm run build:cap

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android build
        run: |
          cd android
          sed -i 's/versionCode 1/versionCode 1/' app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.0"/' app/build.gradle
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Carpenter3D<\/string>/' app/src/main/res/values/strings.xml
          sed -i 's/com.getcapacitor.app/com.imadkrouni.carpenter3d/g' app/build.gradle 2>/dev/null || true
          sed -i 's/namespace ".*"/namespace "com.imadkrouni.carpenter3d"/' app/build.gradle 2>/dev/null || true
          sed -i 's/applicationId ".*"/applicationId "com.imadkrouni.carpenter3d"/' app/build.gradle 2>/dev/null || true
          # زيادة ذاكرة Gradle
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> gradle.properties

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Carpenter3D-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/app/build/reports/
            android/build/reports/
          retention-days: 7
          if-no-files-found: ignore
