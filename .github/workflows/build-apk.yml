name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'dist/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest cross-env --save

      - name: Build web (for Capacitor)
        run: npm run build:cap

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android build
        run: |
          cd android
          # اجعل الإصدار قابلاً للتحديث
          sed -i 's/versionCode 1/versionCode 1/' app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.0"/' app/build.gradle
          # اسم التطبيق
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Carpenter3D<\/string>/' app/src/main/res/values/strings.xml
          # اسم الحزمة
          sed -i 's/com.getcapacitor.app/com.imadkrouni.carpenter3d/g' app/build.gradle 2>/dev/null || true
          sed -i 's/namespace ".*"/namespace "com.imadkrouni.carpenter3d"/' app/build.gradle 2>/dev/null || true
          sed -i 's/applicationId ".*"/applicationId "com.imadkrouni.carpenter3d"/' app/build.gradle 2>/dev/null || true

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Carpenter3D-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK (if exists)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Carpenter3D-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore
